version: "3.9"

services:
  db:
    image: postgres:latest
    container_name: chatapp-db
    restart: always

    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - chatapp_pg_data:/var/lib/postgresql/data

volumes:
  chatapp_pg_data: